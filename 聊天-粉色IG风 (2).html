<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>聊天 · 粉色 IG 风</title>
<style>
  /* ============ 基础布局骨架（供上面的美化规则覆盖） ============ */
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
               "Microsoft YaHei", system-ui, sans-serif;
    background:#f6f4f6;
    color:#111;
  }

  .chat-room{
    height:100dvh;
    display:flex; flex-direction:column;
    background:#f6f4f6;
    overflow:hidden;
  }

  /* 顶栏 */
  .chat-header{
    flex:0 0 auto;
    position:relative;
    display:flex; align-items:center;
    height:52px;
    padding:0 12px;
    background:#f6f4f6;
  }
  .icon-row{ display:flex; align-items:center; gap:4px; }
  .icon-button{
    appearance:none; border:0; background:none; cursor:pointer;
    width:32px; height:32px; display:grid; place-items:center;
    font-size:18px; color:#1a1a1a;
  }
  .chat-person{ display:flex; flex-direction:column; align-items:center; }
  .chat-person strong{ font-size:16px; font-weight:600; }
  .chat-person span{ font-size:11px; color:#8e8e93; }

  /* 聊天记录区（唯一滚动区） */
  .chat-body{
    flex:1 1 auto;
    overflow-y:auto;
    padding:10px 14px 16px;
    display:flex; flex-direction:column;
  }
  .chat-body::-webkit-scrollbar{ display:none; }

  .message-row{
    display:flex; align-items:flex-start;
    gap:8px; margin:3px 0;
  }
  .message-row.user{ justify-content:flex-end; flex-direction:row-reverse; }

  .avatar{
    flex:0 0 30px; width:30px; height:30px; border-radius:50%;
    background:#e9e3e8; color:#7a6f75;
    display:grid; place-items:center;
    font-size:11px; font-weight:600;
  }
  .message-row.user .avatar{ background:#f3d4dc; color:#8a5563; }

  .bubble-wrap{
    display:flex; flex-direction:column;
    gap:2px;
    max-width:min(80%, 300px);
  }

  .bubble{
    display:inline-block;
    word-break:break-word;
    overflow-wrap:break-word;
  }

  .quote-card{ font-size:12.5px; line-height:1.4; }

  /* 图片/贴纸占位 */
  .bubble.image{
    width:150px; height:150px;
    display:grid; place-items:center;
    background:#f1e9ed; color:#a48b94;
    font-size:12px;
  }

  /* 底栏 */
  .composer{
    flex:0 0 auto;
    position:relative;
    display:flex; align-items:center; gap:8px;
    padding:8px 12px calc(env(safe-area-inset-bottom, 0px) + 12px);
    background:#ffffff;
    border-top:1px solid #ececec;
  }
  .composer .icon-button,
  .composer .voice-button,
  .composer .sticker-button{
    appearance:none; border:0; background:none; cursor:pointer;
    width:32px; height:32px; display:grid; place-items:center;
    font-size:18px; color:#1a1a1a;
  }
  .composer-input{ flex:1 1 auto; min-width:0; }
  .composer-input textarea{
    width:100%; height:38px; resize:none;
    border:1px solid #e6e6ea; border-radius:19px;
    padding:9px 14px; font:inherit; font-size:15px;
    color:#111; outline:none; background:#fff;
  }

  /* ============ 你提供的美化代码（粉色系一体化覆盖版） ============ */

  /* 1. 顶部备注名绝对居中 */
  .chat-room .chat-header {
    position: relative !important;
  }
  .chat-room .chat-header .chat-person {
    position: absolute !important;
    left: 50% !important;
    transform: translateX(-50%) !important;
    text-align: center !important;
    pointer-events: none !important;
  }
  .chat-room .chat-header .chat-person strong {
    pointer-events: auto !important;
  }

  /* 2. 顶栏右侧图标：倒数第 2、3 个透明可点击，最右侧保留可见 */
  .chat-room .chat-header .icon-row .icon-button:nth-last-child(2),
  .chat-room .chat-header .icon-row .icon-button:nth-last-child(3) {
    opacity: 0 !important;
    pointer-events: auto !important;
  }
  .chat-room .chat-header .icon-row .icon-button:last-child {
    opacity: 1 !important;
  }

  /* 3. 紧凑行间距与头像对齐 */
  .chat-room .message-row {
    margin: 3px 0 !important;
    gap: 8px !important;
  }
  .chat-room .bubble-wrap {
    max-width: min(80%, 300px) !important;
    gap: 2px !important;
  }

  /* 4. 时间戳：去背景，尺寸回调至微精细 11.5px，同时拉大与上下气泡的间距 */
  .chat-room .message-time-divider {
    margin: 18px 0 14px !important;
  }
  .chat-room .message-time-divider time {
    background: transparent !important;
    box-shadow: none !important;
    -webkit-backdrop-filter: none !important;
    backdrop-filter: none !important;
    color: #8e8e93 !important;
    font-size: 11.5px !important;
    font-weight: 500 !important;
  }

  /* 5. 对方气泡：透粉近白 (#FFF8FA) */
  .chat-room .bubble {
    min-width: 32px !important;
    max-width: 100% !important;
    padding: 8.5px 15px !important;
    border-radius: 19px !important;
    font-size: 14.5px !important;
    line-height: 1.42 !important;
    background: #fff8fa !important;
    color: #111111 !important;
    box-shadow: none !important;
  }

  /* 6. 自己的气泡：极微若隐淡粉 (#FFF0F4) */
  .chat-room .message-row.user .bubble {
    background: #fff0f4 !important;
    color: #111111 !important;
  }

  /* 7. 表情包/贴纸去气泡背景（双方均透明无阴影、无内边距） */
  .chat-room .bubble.sticker,
  .chat-room .bubble.image,
  .chat-room .message-row.user .bubble.sticker,
  .chat-room .message-row.user .bubble.image {
    padding: 0 !important;
    background: transparent !important;
    box-shadow: none !important;
    border-radius: 0 !important;
  }

  /* 8. 引用去背景：粉色调竖线 (#F3A6B8) 与温润灰粉文字 (#9E7C85) */
  .chat-room .quote-card,
  .chat-room .composer-quote {
    background: transparent !important;
    box-shadow: none !important;
    border-left: 2px solid #f3a6b8 !important;
    border-radius: 0 !important;
    padding: 3px 8px !important;
    color: #9e7c85 !important;
  }

  /* 9. 连续发送时的气泡融合与间距 */
  .chat-room .message-row.message-group-first,
  .chat-room .message-row.message-group-middle {
    margin-bottom: 1px !important;
  }
  .chat-room .message-row.message-group-middle,
  .chat-room .message-row.message-group-last {
    margin-top: 1px !important;
  }

  /* 对方（左侧）连发气泡微圆角 */
  .chat-room .message-row:not(.user) .bubble-group-first {
    border-bottom-left-radius: 4px !important;
  }
  .chat-room .message-row:not(.user) .bubble-group-middle {
    border-top-left-radius: 4px !important;
    border-bottom-left-radius: 4px !important;
  }
  .chat-room .message-row:not(.user) .bubble-group-last {
    border-top-left-radius: 4px !important;
  }

  /* 自己（右侧）连发气泡微圆角 */
  .chat-room .message-row.user .bubble-group-first {
    border-bottom-right-radius: 4px !important;
  }
  .chat-room .message-row.user .bubble-group-middle {
    border-top-right-radius: 4px !important;
    border-bottom-right-radius: 4px !important;
  }
  .chat-room .message-row.user .bubble-group-last {
    border-top-right-radius: 4px !important;
  }

  /* 10. 底栏图标调整、输入框拉长、占位符及表情包隐藏 */
  .chat-room .composer {
    position: relative !important;
  }

  /* 最左侧第 1 个图标（设置）常显，↺ 图标 */
  .chat-room .composer > :first-child {
    position: relative !important;
    z-index: 2 !important;
    opacity: 1 !important;
    pointer-events: auto !important;
    display: grid !important;
    place-items: center !important;
  }
  .chat-room .composer > :first-child svg,
  .chat-room .composer > :first-child i,
  .chat-room .composer > :first-child img {
    display: none !important;
  }
  .chat-room .composer > :first-child::after {
    content: '↺' !important;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif !important;
    font-size: 20px !important;
    font-weight: 500 !important;
    color: #1a1a1a !important;
    line-height: 1 !important;
    -webkit-font-smoothing: antialiased !important;
  }

  /* 底栏语音键图标微调 (0.94x) */
  .chat-room .composer .voice-button svg,
  .chat-room .composer .voice-button i,
  .chat-room .composer .voice-button img {
    transform: scale(0.94) !important;
    transform-origin: center !important;
  }

  /* 输入框左侧紧随其后的图标透明可点 */
  .chat-room .composer > .icon-button:nth-child(2),
  .chat-room .composer > .icon-button:nth-child(3),
  .chat-room .composer > .voice-button:nth-child(2),
  .chat-room .composer > .voice-button:nth-child(3) {
    opacity: 0 !important;
    pointer-events: auto !important;
    position: relative !important;
    z-index: 2 !important;
  }

  /* 输入框向左延展覆盖透明区域 */
  .chat-room .composer .composer-input {
    position: relative !important;
    z-index: 1 !important;
    flex: 1 !important;
    margin-left: calc(-2 * (var(--top-icon-button-width, 32px) + 8px)) !important;
    padding-left: calc(2 * (var(--top-icon-button-width, 32px) + 8px) + 8px) !important;
  }

  /* 隐藏输入框文字占位符 (Placeholder) */
  .chat-room .composer-input textarea::placeholder {
    color: transparent !important;
    opacity: 0 !important;
  }

  /* 隐藏表情包按钮但保留点击交互区 */
  .chat-room .composer .sticker-button {
    opacity: 0 !important;
    pointer-events: auto !important;
  }
</style>
</head>
<body>

  <div class="chat-room">

    <!-- 顶栏 -->
    <header class="chat-header">
      <div class="icon-row">
        <button class="icon-button" aria-label="返回"><i>←</i></button>
        <button class="icon-button" aria-label="菜单"><i>☰</i></button>
        <button class="icon-button" aria-label="更多"><i>☰</i></button>
      </div>
      <div class="chat-person">
        <strong>夏逾</strong>
        <span>在线</span>
      </div>
    </header>

    <!-- 聊天记录 -->
    <main class="chat-body">

      <div class="message-time-divider">
        <time>今天 14:59</time>
      </div>

      <!-- 对方连发：第一条 -->
      <div class="message-row message-group-first">
        <span class="avatar">AI</span>
        <div class="bubble-wrap">
          <div class="bubble bubble-group-first">你好，我是你的 AI 助手。</div>
        </div>
      </div>

      <!-- 对方连发：最后一条 -->
      <div class="message-row message-group-last">
        <span class="avatar">AI</span>
        <div class="bubble-wrap">
          <div class="bubble bubble-group-last">有什么想聊的，都可以跟我说。</div>
        </div>
      </div>

      <!-- 自己连发：第一条 -->
      <div class="message-row user message-group-first">
        <span class="avatar">我</span>
        <div class="bubble-wrap">
          <div class="bubble bubble-group-first">在吗</div>
        </div>
      </div>

      <!-- 自己连发：最后一条 -->
      <div class="message-row user message-group-last">
        <span class="avatar">我</span>
        <div class="bubble-wrap">
          <div class="bubble bubble-group-last">今天有点累，想找人聊聊。</div>
        </div>
      </div>

      <!-- 对方：带引用回复 -->
      <div class="message-row">
        <span class="avatar">AI</span>
        <div class="bubble-wrap">
          <div class="quote-card">我：今天有点累，想找人聊聊。</div>
          <div class="bubble">在的，我陪着你，慢慢来就好。</div>
        </div>
      </div>

      <!-- 对方：图片/占位气泡 -->
      <div class="message-row">
        <span class="avatar">AI</span>
        <div class="bubble-wrap">
          <div class="bubble image">图片占位</div>
        </div>
      </div>

    </main>

    <!-- 底栏 -->
    <footer class="composer">
      <button class="icon-button" aria-label="返回"><i>↺</i></button>
      <button class="sticker-button" aria-label="表情"><i>😊</i></button>
      <button class="icon-button" aria-label="更多"><i>➕</i></button>
      <div class="composer-input">
        <textarea rows="1" placeholder="发送消息…"></textarea>
      </div>
      <button class="voice-button" aria-label="语音"><i>🎤</i></button>
    </footer>

  </div>

</body>
</html>
