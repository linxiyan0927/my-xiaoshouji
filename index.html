<style>
/* ============================================================
   小手机 · 合一版 —— 桌面样式
   ============================================================ */

/* ---------- 基础重置 ---------- */
*,
*::before,
*::after{ box-sizing: border-box; }

html, body{ height: 100%; }

html{
  background: var(--bg-desk);
  -webkit-text-size-adjust: 100%;
}

body{
  position: relative;
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 420px;
  height: 100dvh;
  margin: 0 auto;
  overflow: hidden;
  background: var(--screen);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
               "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  -webkit-tap-highlight-color: transparent;
}

button, input, textarea{ font-family: inherit; }
button{ color: inherit; cursor: pointer; }
svg{ display: block; }

/* 隐藏图标精灵 */
.sprite{
  position: absolute;
  width: 0;
  height: 0;
  overflow: hidden;
  pointer-events: none;
}

/* ---------- 主题变量 ---------- */
:root{
  --bg-desk: #d8d5ce;
  --screen: #f4f3f0;
  --card:   #ffffff;
  --tile:   #ffffff;

  --ink:    #171613;
  --ink-2:  #6c6962;
  --ink-3:  #a6a29a;

  --line:   rgba(23,22,19,.075);
  --soft:   rgba(23,22,19,.05);

  --shadow-s: 0 1px 2px rgba(23,22,19,.06);
  --shadow-m: 0 8px 20px -8px rgba(23,22,19,.16),
              0 2px 6px rgba(23,22,19,.05);
  --shadow-l: 0 18px 40px -14px rgba(23,22,19,.26),
              0 4px 12px rgba(23,22,19,.06);

  --r-lg: 24px;
  --r-md: 18px;
  --r-sm: 12px;
}

html[data-theme="night"]{
  --bg-desk: #0b0b0d;
  --screen:  #101012;
  --card:    #1c1c20;
  --tile:    #26262b;

  --ink:    #f1f0ec;
  --ink-2:  #a6a39c;
  --ink-3:  #6f6c66;

  --line:   rgba(255,255,255,.09);
  --soft:   rgba(255,255,255,.06);

  --shadow-s: 0 1px 2px rgba(0,0,0,.5);
  --shadow-m: 0 10px 24px -10px rgba(0,0,0,.75),
              0 2px 6px rgba(0,0,0,.35);
  --shadow-l: 0 18px 40px -14px rgba(0,0,0,.85);
}

/* ---------- 图标通用笔画 ---------- */
.icon,
.rabbit,
.sb__mini{
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.icon{ width: 22px; height: 22px; }
.icon--xs{ width: 13px; height: 13px; }
.rabbit{ width: 26px; height: 26px; }

/* ============================================================
   状态栏
   ============================================================ */
.statusbar{
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 46px;
  padding: 0 24px;
  font-size: 12.5px;
  font-weight: 650;
  letter-spacing: .02em;
  user-select: none;
  z-index: 30;
}

.sb__left,
.sb__right{
  display: flex;
  align-items: center;
  gap: 7px;
}

.sb__mute{
  display: inline-flex;
  color: var(--ink-3);
}

.sb__mini{ width: 12px; height: 12px; }

/* 信号条 */
.sb__signal{
  display: flex;
  align-items: flex-end;
  gap: 2px;
  height: 10px;
}
.sb__signal i{
  width: 2.5px;
  border-radius: 1px;
  background: var(--ink);
}
.sb__signal i:nth-child(1){ height: 4px; }
.sb__signal i:nth-child(2){ height: 6px; }
.sb__signal i:nth-child(3){ height: 8px; }
.sb__signal i:nth-child(4){ height: 10px; opacity: .3; }

.sb__5g{
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .04em;
}

/* 电池 */
.sb__battery{
  position: relative;
  width: 24px;
  height: 11.5px;
  padding: 1.5px;
  border: 1.4px solid var(--ink);
  border-radius: 3.5px;
  opacity: .9;
}
.sb__battery::after{
  content: "";
  position: absolute;
  top: 50%;
  right: -4px;
  width: 2px;
  height: 4px;
  transform: translateY(-50%);
  border-radius: 0 1px 1px 0;
  background: var(--ink);
  opacity: .55;
}
.sb__battery-fill{
  display: block;
  width: 66%;
  height: 100%;
  overflow: hidden;
  border-radius: 1.5px;
  background: var(--ink);
  font-size: 0;          /* 隐藏数字，仅作为填充条 */
  transition: width .35s ease;
}

/* ============================================================
   分页容器
   ============================================================ */
.pager{
  flex: 1 1 auto;
  display: flex;
  overflow-x: auto;
  overflow-y: hidden;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
  overscroll-behavior-x: contain;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.pager::-webkit-scrollbar{ display: none; }

.page{
  flex: 0 0 100%;
  width: 100%;
  height: 100%;
  overflow-x: hidden;
  overflow-y: auto;
  scroll-snap-align: center;
  scroll-snap-stop: always;
  scrollbar-width: none;
}
.page::-webkit-scrollbar{ display: none; }

.page__inner{
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 4px 16px 196px;   /* 底部留白给 Dock / 圆点 */
}

.page__inner--wide{ gap: 16px; }

/* ============================================================
   通用卡片
   ============================================================ */
.card{
  position: relative;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--card);
  box-shadow: var(--shadow-m);
}

.card__bar{
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

/* 小圆按钮 */
.mini{
  display: inline-grid;
  place-items: center;
  width: 28px;
  height: 28px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: var(--soft);
  color: var(--ink-2);
  transition: background .18s, transform .18s;
}
.mini .icon{ width: 15px; height: 15px; }
.mini:hover{ background: rgba(23,22,19,.1); }
.mini:active{ transform: scale(.9); }
.mini--sm{ width: 22px; height: 22px; }
.mini--sm .icon{ width: 13px; height: 13px; }

/* 标签文字 */
.label{
  display: inline-block;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.label--lower{
  font-size: 10px;
  letter-spacing: .08em;
  text-transform: lowercase;
}
.label--wide{ letter-spacing: .2em; }

/* ============================================================
   问候卡
   ============================================================ */
.greet__body{
  display: flex;
  align-items: center;
  gap: 14px;
}

.dots-tile{
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  width: 64px;
  height: 64px;
  border-radius: var(--r-md);
  color: #3b3831;
  background-color: #eeece7;
  background-image: radial-gradient(circle, rgba(23,22,19,.16) 1px, transparent 1px);
  background-size: 8px 8px;
  background-position: 2px 2px;
}
.dots-tile--sm{
  width: 44px;
  height: 44px;
  border-radius: 14px;
  background-size: 7px 7px;
}
.dots-tile--sm .rabbit{ width: 22px; height: 22px; }

.greet__text{ min-width: 0; }
.greet__line1{
  margin: 0;
  font-size: 14px;
  font-weight: 650;
  letter-spacing: .01em;
}
.greet__line2{
  margin: 5px 0 0;
  font-size: 11.5px;
  line-height: 1.6;
  color: var(--ink-3);
}

/* ============================================================
   应用网格
   ============================================================ */
.grid{ display: grid; }

.grid--4{
  grid-template-columns: repeat(4, 1fr);
  gap: 16px 8px;
}
.grid--2{
  grid-template-columns: repeat(2, 1fr);
  gap: 16px 12px;
}

.app{
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  text-align: center;
  transition: transform .16s ease;
}
.app:active{ transform: scale(.94); }

.tile{
  display: grid;
  place-items: center;
  width: 58px;
  height: 58px;
  border-radius: 17px;
  background: var(--tile);
  color: var(--ink);
  box-shadow: 0 6px 14px -6px rgba(23,22,19,.22),
              0 1px 2px rgba(23,22,19,.06),
              inset 0 0 0 1px var(--line);
  transition: transform .18s ease, box-shadow .18s ease;
}
.tile .icon{ width: 25px; height: 25px; }
.app:hover .tile{
  transform: translateY(-2px);
  box-shadow: 0 12px 22px -10px rgba(23,22,19,.3),
              0 2px 4px rgba(23,22,19,.06),
              inset 0 0 0 1px var(--line);
}

.app__label{
  font-size: 11.5px;
  line-height: 1.25;
  color: var(--ink-2);
  letter-spacing: .01em;
}

/* 静态“日期”图标 */
.tile--date{
  background: linear-gradient(160deg, #fdfcfa, #f1efea);
  font-size: 22px;
  font-weight: 750;
  letter-spacing: -.02em;
  color: var(--ink);
}
html[data-theme="night"] .tile--date{
  background: linear-gradient(160deg, #2c2c32, #202024);
}

/* ============================================================
   正在播放条
   ============================================================ */
.nowplaying{
  display: flex;
  align-items: center;
  gap: 13px;
  width: 100%;
  padding: 12px 16px 12px 12px;
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--card);
  box-shadow: var(--shadow-m);
  color: inherit;
  text-align: left;
  transition: transform .18s ease;
}
.nowplaying:active{ transform: scale(.985); }

.np__text{
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
  min-width: 0;
}
.np__title{
  font-size: 14px;
  font-weight: 650;
  letter-spacing: .01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.np__title--sm{ font-size: 13px; }
.np__sub{
  font-size: 11.5px;
  color: var(--ink-3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 波形动画 */
.np__wave{
  display: flex;
  align-items: flex-end;
  gap: 2.5px;
  flex: 0 0 auto;
  height: 18px;
}
.np__wave i{
  width: 3px;
  border-radius: 2px;
  background: var(--ink);
  transform-origin: bottom;
  animation: wave 1.1s ease-in-out infinite;
}
.np__wave i:nth-child(1){ height: 55%; animation-delay: 0s;    opacity: .9; }
.np__wave i:nth-child(2){ height: 100%; animation-delay: .16s; opacity: .9; }
.np__wave i:nth-child(3){ height: 40%; animation-delay: .32s; opacity: .9; }
.np__wave i:nth-child(4){ height: 78%; animation-delay: .48s; opacity: .9; }

@keyframes wave{
  0%, 100%{ transform: scaleY(.35); }
  50%     { transform: scaleY(1); }
}

/* ============================================================
   标点快捷
   ============================================================ */
.marks{
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  padding-top: 2px;
}
.mark{
  min-width: 48px;
  padding: 9px 14px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--card);
  box-shadow: var(--shadow-s);
  font-size: 14px;
  color: var(--ink);
  transition: transform .15s ease, background .15s ease;
}
.mark:hover{ background: var(--soft); }
.mark:active{ transform: scale(.93); }

/* ============================================================
   收件箱
   ============================================================ */
.inbox{ padding: 14px 16px 12px; }

.inbox__head{
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 2px;
}
.inbox__new{
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--ink);
  color: var(--screen);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .03em;
}

.inbox__list{
  display: flex;
  flex-direction: column;
  margin-top: 4px;
}
.inbox__list > *{
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  padding: 11px 0;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: none;
  font: inherit;
  color: inherit;
  text-align: left;
  transition: opacity .18s;
}
.inbox__list > *:hover{ opacity: .72; }
.inbox__list > *:last-child{
  border-bottom: 0;
  padding-bottom: 2px;
}

/* ============================================================
   日历卡
   ============================================================ */
.cal{ padding: 14px 16px 16px; }

.cal__body{
  display: flex;
  gap: 14px;
}

.cal__side{
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 7px;
  flex: 0 0 auto;
  width: 56px;
  color: var(--ink-3);
}
.cal__month{
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .18em;
  color: var(--ink);
}
.cal__rule{
  width: 18px;
  height: 1px;
  background: var(--line);
}
.cal__weekday{
  font-size: 10px;
  color: var(--ink-2);
  letter-spacing: .02em;
}
.cal__hint{ font-size: 10px; }

.cal__main{ flex: 1; min-width: 0; }

.cal__nav{
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.cal__year{
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .08em;
}

.cal__week{
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
  margin-bottom: 4px;
}
.cal__week > *{
  text-align: center;
  font-size: 9.5px;
  color: var(--ink-3);
  letter-spacing: .02em;
}

.cal__grid{
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
}
.cal__grid > *{
  display: grid;
  place-items: center;
  aspect-ratio: 1;
  padding: 0;
  border: 0;
  border-radius: 9px;
  background: transparent;
  font: inherit;
  font-size: 11.5px;
  color: var(--ink-2);
  transition: background .15s ease, color .15s ease;
}
.cal__grid > *:hover{ background: var(--soft); }

/* ============================================================
   播放器卡
   ============================================================ */
.player__head{
  display: flex;
  align-items: center;
  gap: 12px;
}

.player__art{
  flex: 0 0 auto;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  overflow: hidden;
  box-shadow: 0 6px 14px -6px rgba(23,22,19,.55);
}
.vinyl{
  display: block;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background:
    radial-gradient(circle at 50% 50%, #4a4a4e 0 16%, #17171a 17% 58%, #2b2b30 59% 78%, #141417 79% 100%);
  animation: spin 9s linear infinite;
}
@keyframes spin{ to{ transform: rotate(360deg); } }

.player__meta{
  display: flex;
  flex-direction: column;
  gap: 1px;
  flex: 1;
  min-width: 0;
}
.player__tag{
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-top: 2px;
  font-size: 9.5px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-3);
}

.player__row{
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.player__input{
  flex: 1;
  min-width: 0;
  padding: 11px 14px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--soft);
  font-size: 12.5px;
  color: var(--ink);
  outline: none;
  transition: border-color .18s ease, background .18s ease;
}
.player__input::placeholder{ color: var(--ink-3); }
.player__input:focus{
  border-color: rgba(23,22,19,.22);
  background: var(--card);
}

.round-btn{
  display: inline-grid;
  place-items: center;
  flex: 0 0 auto;
  width: 40px;
  height: 40px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: var(--soft);
  color: var(--ink);
  transition: transform .16s ease, background .16s ease;
}
.round-btn .icon{ width: 17px; height: 17px; }
.round-btn:hover{ background: rgba(23,22,19,.1); }
.round-btn:active{ transform: scale(.9); }

.round-btn--dark{
  background: var(--ink);
  color: var(--screen);
}
.round-btn--dark:hover{ background: var(--ink); opacity: .88; }

/* ============================================================
   角色主页
   ============================================================ */
.profile__top{
  display: flex;
  align-items: center;
  gap: 12px;
}

.avatar{
  display: inline-grid;
  place-items: center;
  flex: 0 0 auto;
  border-radius: 50%;
  color: #3b3831;
  background: linear-gradient(150deg, #f2efe9, #e0dcd4);
}
html[data-theme="night"] .avatar{
  color: #d9d6cf;
  background: linear-gradient(150deg, #2e2e34, #202024);
}
.avatar--lg{ width: 54px; height: 54px; }
.avatar--lg .rabbit{ width: 30px; height: 30px; }
.avatar--xs{ width: 26px; height: 26px; }
.avatar--xs .rabbit{ width: 15px; height: 15px; }

.profile__id{
  display: flex;
  flex-direction: column;
  flex: 1;
  min-width: 0;
}
.profile__name{
  font-size: 16px;
  font-weight: 700;
  letter-spacing: .01em;
}
.profile__handle{
  font-size: 11.5px;
  color: var(--ink-3);
}

.follow{
  padding: 7px 17px;
  border: 0;
  border-radius: 999px;
  background: var(--ink);
  color: var(--screen);
  font-size: 12px;
  font-weight: 650;
  letter-spacing: .02em;
  transition: transform .16s ease, background .18s ease, color .18s ease;
}
.follow:active{ transform: scale(.94); }
.follow[aria-pressed="true"]{
  background: var(--soft);
  color: var(--ink-2);
}

.profile__line{
  margin: 13px 0 0;
  font-size: 13px;
  color: var(--ink-2);
}

.profile__stats{
  display: flex;
  gap: 24px;
  margin-top: 13px;
  padding-top: 13px;
  border-top: 1px solid var(--line);
}
.stat{
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.stat b{ font-size: 14px; font-weight: 700; }
.stat i{
  font-size: 10.5px;
  font-style: normal;
  color: var(--ink-3);
}

.profile__bio{
  margin: 13px 0 0;
  font-size: 11.5px;
  line-height: 1.65;
  color: var(--ink-3);
}

/* ---------- 拍立得 ---------- */
.polaroid-wrap{
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.polaroid{
  align-self: center;
  width: min(222px, 70%);
  margin: 4px 0;
  padding: 10px 10px 30px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--card);
  box-shadow: var(--shadow-l);
  transform: rotate(-1.6deg);
  transition: transform .35s cubic-bezier(.32,.72,.28,1);
}
.polaroid:hover{ transform: rotate(0deg) scale(1.02); }

.polaroid__img{
  display: grid;
  place-items: center;
  aspect-ratio: 1;
  border-radius: 10px;
  color: #46423a;
  background:
    radial-gradient(circle at 50% 38%, #f5f2ec 0%, #e6e2da 70%, #ddd8cf 100%);
}
html[data-theme="night"] .polaroid__img{
  color: #c9c6bf;
  background: radial-gradient(circle at 50% 38%, #2d2d33, #1e1e22);
}
.polaroid__img .rabbit{
  width: 46%;
  height: 46%;
  opacity: .7;
}
.polaroid__cap{
  margin: 9px 0 0;
  text-align: center;
  font-size: 11px;
  letter-spacing: .05em;
  color: var(--ink-3);
}

/* ---------- 周条 ---------- */
.weekstrip{
  display: flex;
  justify-content: space-between;
  gap: 4px;
  padding: 11px 8px;
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--card);
  box-shadow: var(--shadow-m);
}
.weekstrip > *{
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  padding: 7px 0;
  border: 0;
  border-radius: 12px;
  background: none;
  font: inherit;
  font-size: 10.5px;
  color: var(--ink-3);
  transition: background .18s ease, color .18s ease;
}
.weekstrip > *:hover{ background: var(--soft); }

/* ============================================================
   角色档案（第 4 页）
   ============================================================ */
.covercard{
  padding: 0;
  overflow: hidden;
}

.cover__band{
  position: relative;
  height: 98px;
  background-color: #ecebe6;
  background-image: radial-gradient(circle, rgba(23,22,19,.14) 1px, transparent 1px);
  background-size: 9px 9px;
  background-position: 3px 3px;
}
html[data-theme="night"] .cover__band{
  background-color: #232328;
  background-image: radial-gradient(circle, rgba(255,255,255,.14) 1px, transparent 1px);
}

.cover__avatar{
  position: absolute;
  left: 18px;
  bottom: -26px;
