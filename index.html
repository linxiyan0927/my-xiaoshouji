<!DOCTYPE html>
<html lang="zh-CN" data-theme="day">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小手机</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23f5f4f2'/%3E%3Cpath d='M22 26c0-6 4-10 10-10s10 4 10 10' fill='none' stroke='%23141414' stroke-width='4'/%3E%3Cpath d='M27 30c0-3 2-5 5-5s5 2 5 5' fill='none' stroke='%23141414' stroke-width='4'/%3E%3C/svg%3E">
<style>
/* ============================================================
   小手机 · 合一版 —— 桌面样式
   ============================================================ */
*, *::before, *::after{ box-sizing: border-box; }
html, body{ height: 100%; }
html{ background: var(--bg-desk); -webkit-text-size-adjust: 100%; }
body{
  position: relative; display: flex; flex-direction: column; width: 100%; max-width: 420px; height: 100dvh;
  margin: 0 auto; overflow: hidden; background: var(--screen); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; -webkit-tap-highlight-color: transparent;
}
button, input, textarea{ font-family: inherit; }
button{ color: inherit; cursor: pointer; }
svg{ display: block; }
.sprite{ position: absolute; width: 0; height: 0; overflow: hidden; pointer-events: none; }

:root{
  --bg-desk: #d8d5ce; --screen: #f4f3f0; --card: #ffffff; --tile: #ffffff;
  --ink: #171613; --ink-2: #6c6962; --ink-3: #a6a29a;
  --line: rgba(23,22,19,.075); --soft: rgba(23,22,19,.05);
  --shadow-s: 0 1px 2px rgba(23,22,19,.06);
  --shadow-m: 0 8px 20px -8px rgba(23,22,19,.16), 0 2px 6px rgba(23,22,19,.05);
  --shadow-l: 0 18px 40px -14px rgba(23,22,19,.26), 0 4px 12px rgba(23,22,19,.06);
  --r-lg: 24px; --r-md: 18px; --r-sm: 12px;
}
html[data-theme="night"]{
  --bg-desk: #0b0b0d; --screen: #101012; --card: #1c1c20; --tile: #26262b;
  --ink: #f1f0ec; --ink-2: #a6a39c; --ink-3: #6f6c66;
  --line: rgba(255,255,255,.09); --soft: rgba(255,255,255,.06);
  --shadow-s: 0 1px 2px rgba(0,0,0,.5);
  --shadow-m: 0 10px 24px -10px rgba(0,0,0,.75), 0 2px 6px rgba(0,0,0,.35);
  --shadow-l: 0 18px 40px -14px rgba(0,0,0,.85);
}

.icon, .rabbit, .sb__mini{ fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.icon{ width: 22px; height: 22px; }
.icon--xs{ width: 13px; height: 13px; }
.rabbit{ width: 26px; height: 26px; }

.statusbar{ flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; height: 46px; padding: 0 24px; font-size: 12.5px; font-weight: 650; letter-spacing: .02em; user-select: none; z-index: 30; }
.sb__left, .sb__right{ display: flex; align-items: center; gap: 7px; }
.sb__mute{ display: inline-flex; color: var(--ink-3); }
.sb__mini{ width: 12px; height: 12px; }
.sb__signal{ display: flex; align-items: flex-end; gap: 2px; height: 10px; }
.sb__signal i{ width: 2.5px; border-radius: 1px; background: var(--ink); }
.sb__signal i:nth-child(1){ height: 4px; }
.sb__signal i:nth-child(2){ height: 6px; }
.sb__signal i:nth-child(3){ height: 8px; }
.sb__signal i:nth-child(4){ height: 10px; opacity: .3; }
.sb__5g{ font-size: 10px; font-weight: 800; letter-spacing: .04em; }
.sb__battery{ position: relative; width: 24px; height: 11.5px; padding: 1.5px; border: 1.4px solid var(--ink); border-radius: 3.5px; opacity: .9; }
.sb__battery::after{ content: ""; position: absolute; top: 50%; right: -4px; width: 2px; height: 4px; transform: translateY(-50%); border-radius: 0 1px 1px 0; background: var(--ink); opacity: .55; }
.sb__battery-fill{ display: block; width: 66%; height: 100%; overflow: hidden; border-radius: 1.5px; background: var(--ink); font-size: 0; transition: width .35s ease; }

.pager{ flex: 1 1 auto; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scroll-behavior: smooth; overscroll-behavior-x: contain; scrollbar-width: none; -ms-overflow-style: none; }
.pager::-webkit-scrollbar{ display: none; }
.page{ flex: 0 0 100%; width: 100%; height: 100%; overflow-x: hidden; overflow-y: auto; scroll-snap-align: center; scroll-snap-stop: always; scrollbar-width: none; }
.page::-webkit-scrollbar{ display: none; }
.page__inner{ display: flex; flex-direction: column; gap: 14px; padding: 4px 16px 196px; }
.page__inner--wide{ gap: 16px; }

.card{ position: relative; padding: 16px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--card); box-shadow: var(--shadow-m); }
.card__bar{ display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.mini{ display: inline-grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 50%; background: var(--soft); color: var(--ink-2); transition: background .18s, transform .18s; }
.mini .icon{ width: 15px; height: 15px; }
.mini:hover{ background: rgba(23,22,19,.1); }
.mini:active{ transform: scale(.9); }
.mini--sm{ width: 22px; height: 22px; }
.mini--sm .icon{ width: 13px; height: 13px; }
.label{ display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); }
.label--lower{ font-size: 10px; letter-spacing: .08em; text-transform: lowercase; }
.label--wide{ letter-spacing: .2em; }

.greet__body{ display: flex; align-items: center; gap: 14px; }
.dots-tile{ display: grid; place-items: center; flex: 0 0 auto; width: 64px; height: 64px; border-radius: var(--r-md); color: #3b3831; background-color: #eeece7; background-image: radial-gradient(circle, rgba(23,22,19,.16) 1px, transparent 1px); background-size: 8px 8px; background-position: 2px 2px; }
.dots-tile--sm{ width: 44px; height: 44px; border-radius: 14px; background-size: 7px 7px; }
.dots-tile--sm .rabbit{ width: 22px; height: 22px; }
.greet__text{ min-width: 0; }
.greet__line1{ margin: 0; font-size: 14px; font-weight: 650; letter-spacing: .01em; }
.greet__line2{ margin: 5px 0 0; font-size: 11.5px; line-height: 1.6; color: var(--ink-3); }

.grid{ display: grid; }
.grid--4{ grid-template-columns: repeat(4, 1fr); gap: 16px 8px; }
.grid--2{ grid-template-columns: repeat(2, 1fr); gap: 16px 12px; }
.app{ display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 0; border: 0; background: none; color: inherit; text-align: center; transition: transform .16s ease; }
.app:active{ transform: scale(.94); }
.tile{ display: grid; place-items: center; width: 58px; height: 58px; border-radius: 17px; background: var(--tile); color: var(--ink); box-shadow: 0 6px 14px -6px rgba(23,22,19,.22), 0 1px 2px rgba(23,22,19,.06), inset 0 0 0 1px var(--line); transition: transform .18s ease, box-shadow .18s ease; }
.tile .icon{ width: 25px; height: 25px; }
.app:hover .tile{ transform: translateY(-2px); box-shadow: 0 12px 22px -10px rgba(23,22,19,.3), 0 2px 4px rgba(23,22,19,.06), inset 0 0 0 1px var(--line); }
.app__label{ font-size: 11.5px; line-height: 1.25; color: var(--ink-2); letter-spacing: .01em; }
.tile--date{ background: linear-gradient(160deg, #fdfcfa, #f1efea); font-size: 22px; font-weight: 750; letter-spacing: -.02em; color: var(--ink); }
html[data-theme="night"] .tile--date{ background: linear-gradient(160deg, #2c2c32, #202024); }

.nowplaying{ display: flex; align-items: center; gap: 13px; width: 100%; padding: 12px 16px 12px 12px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--card); box-shadow: var(--shadow-m); color: inherit; text-align: left; transition: transform .18s ease; }
.nowplaying:active{ transform: scale(.985); }
.np__text{ display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.np__title{ font-size: 14px; font-weight: 650; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np__title--sm{ font-size: 13px; }
.np__sub{ font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np__wave{ display: flex; align-items: flex-end; gap: 2.5px; flex: 0 0 auto; height: 18px; }
.np__wave i{ width: 3px; border-radius: 2px; background: var(--ink); transform-origin: bottom; animation: wave 1.1s ease-in-out infinite; }
.np__wave i:nth-child(1){ height: 55%; animation-delay: 0s; opacity: .9; }
.np__wave i:nth-child(2){ height: 100%; animation-delay: .16s; opacity: .9; }
.np__wave i:nth-child(3){ height: 40%; animation-delay: .32s; opacity: .9; }
.np__wave i:nth-child(4){ height: 78%; animation-delay: .48s; opacity: .9; }
@keyframes wave{ 0%, 100%{ transform: scaleY(.35); } 50%{ transform: scaleY(1); } }

.marks{ display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding-top: 2px; }
.mark{ min-width: 48px; padding: 9px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); box-shadow: var(--shadow-s); font-size: 14px; color: var(--ink); transition: transform .15s ease, background .15s ease; }
.mark:hover{ background: var(--soft); }
.mark:active{ transform: scale(.93); }

.inbox{ padding: 14px 16px 12px; }
.inbox__head{ display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
.inbox__new{ padding: 3px 9px; border-radius: 999px; background: var(--ink); color: var(--screen); font-size: 10px; font-weight: 700; letter-spacing: .03em; }
.inbox__list{ display: flex; flex-direction: column; margin-top: 4px; }

.cal{ padding: 14px 16px 16px; }
.cal__body{ display: flex; gap: 14px; }
.cal__side{ display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; flex: 0 0 auto; width: 56px; color: var(--ink-3); }
.cal__month{ font-size: 11px; font-weight: 800; letter-spacing: .18em; color: var(--ink); }
.cal__rule{ width: 18px; height: 1px; background: var(--line); }
.cal__weekday{ font-size: 10px; color: var(--ink-2); letter-spacing: .02em; }
.cal__hint{ font-size: 10px; }
.cal__main{ flex: 1; min-width: 0; }
.cal__nav{ display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.cal__year{ font-size: 12px; font-weight: 700; letter-spacing: .08em; }
.cal__week{ display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 4px; }
.cal__week > *{ text-align: center; font-size: 9.5px; color: var(--ink-3); letter-spacing: .02em; }
.cal__grid{ display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal__grid > *{ display: grid; place-items: center; aspect-ratio: 1; padding: 0; border: 0; border-radius: 9px; background: transparent; font: inherit; font-size: 11.5px; color: var(--ink-2); }

.player__head{ display: flex; align-items: center; gap: 12px; }
.player__art{ flex: 0 0 auto; width: 42px; height: 42px; border-radius: 50%; overflow: hidden; box-shadow: 0 6px 14px -6px rgba(23,22,19,.55); }
.vinyl{ display: block; width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 50% 50%, #4a4a4e 0 16%, #17171a 17% 58%, #2b2b30 59% 78%, #141417 79% 100%); animation: spin 9s linear infinite; }
@keyframes spin{ to{ transform: rotate(360deg); } }
.player__meta{ display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0; }
.player__tag{ display: inline-flex; align-items: center; gap: 4px; margin-top: 2px; font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.player__row{ display: flex; gap: 8px; margin-top: 12px; }
.player__input{ flex: 1; min-width: 0; padding: 11px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--soft); font-size: 12.5px; color: var(--ink); outline: none; }
.round-btn{ display: inline-grid; place-items: center; flex: 0 0 auto; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 50%; background: var(--soft); color: var(--ink); transition: transform .16s ease, background .16s ease; }
.round-btn .icon{ width: 17px; height: 17px; }
.round-btn--dark{ background: var(--ink); color: var(--screen); }

.profile__top{ display: flex; align-items: center; gap: 12px; }
.avatar{ display: inline-grid; place-items: center; flex: 0 0 auto; border-radius: 50%; color: #3b3831; background: linear-gradient(150deg, #f2efe9, #e0dcd4); }
.avatar--lg{ width: 54px; height: 54px; }
.avatar--lg .rabbit{ width: 30px; height: 30px; }
.profile__id{ display: flex; flex-direction: column; flex: 1; min-width: 0; }
.profile__name{ font-size: 16px; font-weight: 700; letter-spacing: .01em; }
.profile__handle{ font-size: 11.5px; color: var(--ink-3); }
.follow{ padding: 7px 17px; border: 0; border-radius: 999px; background: var(--ink); color: var(--screen); font-size: 12px; font-weight: 650; }
.profile__line{ margin: 13px 0 0; font-size: 13px; color: var(--ink-2); }
.profile__stats{ display: flex; gap: 24px; margin-top: 13px; padding-top: 13px; border-top: 1px solid var(--line); }
.stat{ display: flex; flex-direction: column; gap: 1px; }
.stat b{ font-size: 14px; font-weight: 700; }
.stat i{ font-size: 10.5px; font-style: normal; color: var(--ink-3); }
.profile__bio{ margin: 13px 0 0; font-size: 11.5px; line-height: 1.65; color: var(--ink-3); }

.polaroid-wrap{ display: flex; flex-direction: column; gap: 16px; }
.polaroid{ align-self: center; width: min(222px, 70%); margin: 4px 0; padding: 10px 10px 30px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); box-shadow: var(--shadow-l); transform: rotate(-1.6deg); }
.polaroid__img{ display: grid; place-items: center; aspect-ratio: 1; border-radius: 10px; color: #46423a; background: radial-gradient(circle at 50% 38%, #f5f2ec 0%, #e6e2da 70%, #ddd8cf 100%); }
.polaroid__img .rabbit{ width: 46%; height: 46%; opacity: .7; }
.polaroid__cap{ margin: 9px 0 0; text-align: center; font-size: 11px; letter-spacing: .05em; color: var(--ink-3); }

.weekstrip{ display: flex; justify-content: space-between; gap: 4px; padding: 11px 8px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--card); box-shadow: var(--shadow-m); }

.covercard{ padding: 0; overflow: hidden; }
.cover__band{ position: relative; height: 98px; background-color: #ecebe6; background-image: radial-gradient(circle, rgba(23,22,19,.14) 1px, transparent 1px); background-size: 9px 9px; }
.cover__avatar{ position: absolute; left: 18px; bottom: -26px; display: grid; place-items: center; width: 64px; height: 64px; border: 3px solid var(--card); border-radius: 50%; background: linear-gradient(150deg, #f4f1eb, #e2ded6); color: #3b3831; box-shadow: 0 8px 18px -8px rgba(23,22,19,.4); }
.cover__body{ padding: 36px 18px 18px; }
.cover__name{ display: block; font-size: 17px; font-weight: 700; }
.cover__handle{ font-size: 11.5px; color: var(--ink-3); }
.cover__quote{ margin: 10px 0 0; font-size: 12.5px; color: var(--ink-2); }
.cover__loc{ display: flex; align-items: center; gap: 4px; margin: 8px 0 0; font-size: 11px; color: var(--ink-3); }

.duo{ display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.counter{ display: flex; flex-direction: column; gap: 6px; padding: 14px; }
.counter__num{ font-size: 21px; font-weight: 750; letter-spacing: -.02em; }
.counter__cap{ font-size: 10.5px; color: var(--ink-3); }
.counter__bar{ display: block; height: 4px; margin-top: 3px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.counter__bar i{ display: block; height: 100%; border-radius: 99px; background: var(--ink); }
.note{ display: flex; flex-direction: column; gap: 6px; padding: 14px; }
.note__text{ margin: 0; font-size: 11.5px; line-height: 1.62; color: var(--ink-2); }
.note__sign{ margin: 0; text-align: right; font-size: 10.5px; color: var(--ink-3); }

.lib__head{ display: flex; flex-direction: column; gap: 4px; padding: 6px 4px 2px; }
.lib__title{ margin: 0; font-size: 22px; font-weight: 750; }

.dots{ position: absolute; left: 50%; bottom: 106px; z-index: 20; display: flex; align-items: center; gap: 7px; padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,.6); box-shadow: var(--shadow-s); backdrop-filter: blur(12px) saturate(150%); -webkit-backdrop-filter: blur(12px) saturate(150%); transform: translateX(-50%); }
.dot{ width: 6px; height: 6px; padding: 0; border: 0; border-radius: 50%; background: rgba(23,22,19,.22); }
.dot.is-on{ width: 16px; border-radius: 99px; background: var(--ink); }

.dock{ position: absolute; left: 50%; bottom: 24px; z-index: 20; display: flex; align-items: center; gap: 8px; padding: 9px; border: 1px solid rgba(255,255,255,.6); border-radius: 26px; background: rgba(255,255,255,.72); box-shadow: var(--shadow-l); backdrop-filter: blur(22px) saturate(170%); -webkit-backdrop-filter: blur(22px) saturate(170%); transform: translateX(-50%); }
.dock__item{ display: grid; place-items: center; width: 46px; height: 46px; padding: 0; border: 0; border-radius: 16px; background: transparent; color: var(--ink); transition: background .18s ease, transform .18s ease; }
.dock__item:active{ transform: scale(.9); }
.dock__item .icon{ width: 22px; height: 22px; }

.fab{ position: absolute; right: 18px; bottom: 104px; z-index: 20; display: grid; place-items: center; width: 50px; height: 50px; padding: 0; border: 0; border-radius: 50%; background: var(--ink); color: var(--screen); box-shadow: 0 14px 26px -10px rgba(23,22,19,.7); }
.fab .rabbit{ width: 24px; height: 24px; }

.sheet{ position: absolute; inset: 0; z-index: 70; display: flex; align-items: flex-end; justify-content: center; background: rgba(23,22,19,.32); backdrop-filter: blur(3px); }
.sheet__panel{ width: 100%; padding: 12px 20px 32px; border-radius: 26px 26px 0 0; background: var(--card); box-shadow: 0 -16px 44px rgba(23,22,19,.22); }
.sheet__grip{ display: block; width: 36px; height: 4px; margin: 0 auto 14px; border-radius: 99px; background: rgba(23,22,19,.16); }
.sheet__title{ margin: 0 0 12px; font-size: 14px; font-weight: 700; }
.toggles{ display: flex; flex-wrap: wrap; gap: 8px; }
.toggle{ display: inline-flex; align-items: center; gap: 7px; padding: 9px 15px; border: 1px solid var(--line); border-radius: 999px; background: var(--soft); font-size: 12.5px; color: var(--ink-2); }
.toggle__dot{ width: 8px; height: 8px; border-radius: 50%; background: rgba(23,22,19,.2); }
.sheet__links{ display: flex; flex-direction: column; margin-top: 16px; }
.sheet__link{ padding: 13px 4px; border: 0; border-top: 1px solid var(--line); background: none; font-size: 13.5px; color: var(--ink); text-align: left; }
</style>
</head>

<!-- ======== 状态栏 ======== -->
<header class="statusbar" id="statusbar">
  <span class="sb__left">
    <span class="sb__time" id="sbTime">--:--</span>
    <span class="sb__mute"><svg viewBox="0 0 24 24" class="sb__mini"><path d="M4 9.4h3.6l4.4-3.6v12.4l-4.4-3.6H4Z"/><path d="M16 8.4l4 7.2M20 8.4l-4 7.2"/></svg></span>
  </span>
  <span class="sb__right">
    <span class="sb__signal"><i></i><i></i><i></i><i></i></span>
    <span class="sb__5g">5G</span>
    <span class="sb__battery"><span class="sb__battery-fill" id="sbBattery">66</span></span>
  </span>
</header>

<!-- ======== 多页桌面 ======== -->
<main class="pager" id="pager">
  <section class="page" data-page="0">
    <div class="page__inner">
      <article class="card greet" id="greetCard">
        <header class="card__bar">
          <button class="mini" id="greetClose" aria-label="关闭卡片"><svg class="icon"><use href="#i-close" xlink:href="#i-close"></use></svg></button>
          <!-- 【修改点1】第一页右上角的消息图标，加入了跳转 -->
          <button class="mini" data-app="chat" onclick="window.location.href='聊天列表-液态玻璃.html'" aria-label="打开消息"><svg class="icon"><use href="#i-list" xlink:href="#i-list"></use></svg></button>
        </header>
        <div class="greet__body">
          <div class="dots-tile"><svg class="rabbit" viewBox="0 0 24 24"><use href="#i-rabbit" xlink:href="#i-rabbit"></use></svg></div>
          <div class="greet__text">
            <p class="greet__line1">今天也辛苦了 ·ᵕ·</p>
            <p class="greet__line2">you did so well today — even the small<br>things count, even the slow days.</p>
          </div>
        </div>
      </article>

      <div class="grid grid--4" data-grid="overview-a">
        <button class="app" data-app="icidy"><span class="tile"><svg class="icon"><use href="#i-note" xlink:href="#i-note"></use></svg></span><span class="app__label">iCity</span></button>
        <button class="app" data-app="insta"><span class="tile"><svg class="icon"><use href="#i-camera" xlink:href="#i-camera"></use></svg></span><span class="app__label">Insta</span></button>
        <button class="app" data-app="schedule"><span class="tile"><svg class="icon"><use href="#i-cal" xlink:href="#i-cal"></use></svg></span><span class="app__label">日程</span></button>
        <button class="app" data-app="x"><span class="tile"><svg class="icon"><use href="#i-x" xlink:href="#i-x"></use></svg></span><span class="app__label">X</span></button>
      </div>

      <button class="card nowplaying" data-app="music">
        <span class="dots-tile dots-tile--sm"><svg class="rabbit" viewBox="0 0 24 24"><use href="#i-rabbit" xlink:href="#i-rabbit"></use></svg></span>
        <span class="np__text">
          <span class="label label--wide">NOW PLAYING</span>
          <span class="np__title" id="npTitle">incloud</span>
          <span class="np__sub" id="npSub">LiToT — soft hours, vol. 2</span>
        </span>
        <span class="np__wave" id="npWave" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      </button>

      <div class="grid grid--4" data-grid="overview-b">
        <button class="app" data-app="store"><span class="tile"><svg class="icon"><use href="#i-bag" xlink:href="#i-bag"></use></svg></span><span class="app__label">商店</span></button>
        <button class="app" data-app="music"><span class="tile"><svg class="icon"><use href="#i-music" xlink:href="#i-music"></use></svg></span><span class="app__label">音乐</span></button>
        <button class="app" data-app="gallery"><span class="tile"><svg class="icon"><use href="#i-image" xlink:href="#i-image"></use></svg></span><span class="app__label">图库</span></button>
        <button class="app" data-app="health"><span class="tile"><svg class="icon"><use href="#i-heart" xlink:href="#i-heart"></use></svg></span><span class="app__label">健康</span></button>
      </div>
    </div>
  </section>

  <section class="page" data-page="1">
    <div class="page__inner">
      <article class="card inbox">
        <header class="inbox__head"><span class="label label--lower">inbox</span><span class="inbox__new" id="inboxNew">3 new</span></header>
        <div class="inbox__list" id="inboxList"></div>
      </article>
      <article class="card cal" id="calCard">
        <header class="card__bar">
          <button class="mini" id="calClose" aria-label="关闭日历"><svg class="icon"><use href="#i-close" xlink:href="#i-close"></use></svg></button>
          <button class="mini" data-app="schedule" aria-label="打开日程"><svg class="icon"><use href="#i-list" xlink:href="#i-list"></use></svg></button>
        </header>
        <div class="cal__body">
          <div class="cal__side">
            <span class="cal__month" id="calMonth">NOV</span><span class="cal__rule"></span><span class="cal__weekday" id="calWeekday">星期一</span><span class="cal__rule"></span><span class="cal__hint" id="calHint">9 日</span>
          </div>
          <div class="cal__main">
            <div class="cal__nav">
              <button class="mini mini--sm" id="calPrev" aria-label="上个月"><svg class="icon"><use href="#i-chev-l" xlink:href="#i-chev-l"></use></svg></button>
              <span class="cal__year" id="calYear">2026</span>
              <button class="mini mini--sm" id="calNext" aria-label="下个月"><svg class="icon"><use href="#i-chev-r" xlink:href="#i-chev-r"></use></svg></button>
            </div>
            <div class="cal__week" id="calWeek"></div>
            <div class="cal__grid" id="calGrid"></div>
          </div>
        </div>
      </article>
    </div>
  </section>

  <section class="page" data-page="2">
    <div class="page__inner">
      <article class="card profile">
        <div class="profile__top">
          <span class="avatar avatar--lg"><svg class="rabbit" viewBox="0 0 24 24"><use href="#i-rabbit" xlink:href="#i-rabbit"></use></svg></span>
          <div class="profile__id"><span class="profile__name">祁寒知</span><span class="profile__handle">@qi_hz</span></div>
          <button class="follow" id="followBtn" aria-pressed="false">关注</button>
        </div>
        <p class="profile__line">incloud … ㅎㅅㅎ</p>
        <div class="profile__stats">
          <span class="stat"><b>128</b><i>帖子</i></span><span class="stat"><b>2.4k</b><i>关注者</i></span><span class="stat"><b>96</b><i>关注</i></span>
        </div>
        <p class="profile__bio">always be kind to your own heart. 今天的我也要好好待你。</p>
      </article>
      <div class="polaroid-wrap">
        <figure class="polaroid">
          <span class="polaroid__img"><svg class="rabbit" viewBox="0 0 24 24"><use href="#i-rabbit" xlink:href="#i-rabbit"></use></svg></span>
          <figcaption class="polaroid__cap">incloud ⋯</figcaption>
        </figure>
      </div>
    </div>
  </section>
</main>

<!-- ======== 圆点 / Dock / 悬浮按钮 ======== -->
<div class="dots" id="dots" role="tablist" aria-label="桌面页">
  <button class="dot is-on" data-goto="0" aria-label="第 1 页"></button><button class="dot" data-goto="1" aria-label="第 2 页"></button><button class="dot" data-goto="2" aria-label="第 3 页"></button>
</div>

<nav class="dock" aria-label="Dock">

  <button class="dock__item" data-app="chat" onclick="window.location.href='聊天列表-液态玻璃.html'" aria-label="聊天"><svg class="icon"><use href="#i-chat" xlink:href="#i-chat"></use></svg></button>
  <button class="dock__item" data-app="settings" aria-label="设置"><svg class="icon"><use href="#i-gear" xlink:href="#i-gear"></use></svg></button>
  <button class="dock__item" data-app="community" aria-label="社区"><svg class="icon"><use href="#i-users" xlink:href="#i-users"></use></svg></button>
  <button class="dock__item" data-app="worldbook" aria-label="世界书"><svg class="icon"><use href="#i-book" xlink:href="#i-book"></use></svg></button>
</nav>

<button class="fab" id="fab" aria-label="快捷面板"><svg class="rabbit" viewBox="0 0 24 24"><use href="#i-rabbit" xlink:href="#i-rabbit"></use></svg></button>

</body>
