<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>聊天列表 · 液态玻璃</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ededf0'/%3E%3Crect x='10' y='14' width='44' height='16' rx='8' fill='%23ffffff' opacity='.75'/%3E%3Ccircle cx='20' cy='24' r='5' fill='%23111111'/%3E%3Crect x='30' y='20' width='18' height='3' rx='1.5' fill='%23111111'/%3E%3Crect x='14' y='40' width='36' height='12' rx='6' fill='%23111111'/%3E%3C/svg%3E">
<style>
/* =========================================================
   聊天列表 · 液态玻璃版
   · 顶部：无方框，只有左上角「消息」；底层是一层淡磨砂，向下渐隐
   · 底部：半透明玻璃胶囊（模糊 + 高光边 + 内外阴影）
   · 状态栏时间、电量、列表时间全部动态
   ========================================================= */
:root{
  --ink:#111111;
  --ink-2:#8e8e93;
  --ink-3:#a9a9ae;
  --line:rgba(0,0,0,.07);
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{
  margin:0;
  background:#f0f0f0;
  display:grid;
  place-items:center;
  font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
              "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button{ font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }

.screen{
  position:relative;
  width:100%;
  height:100%;
  max-height:100dvh;
  overflow:hidden;
  /* 纯白页面：玻璃靠背后的内容与模糊来体现通透 */
  background:#ffffff;
}
@media (min-width:480px){
  .screen{
    width:393px;
    height:852px;
    max-height:96vh;
    border-radius:44px;
    box-shadow:0 40px 90px -34px rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.06);
  }
}

/* ---------- 顶部玻璃层（无边框，向下渐隐） ---------- */
.glass-top{
  position:absolute;
  top:0; left:0; right:0;
  z-index:20;
  padding-bottom:18px;
  pointer-events:none;
  background:linear-gradient(180deg,
              rgba(255,255,255,.70) 0%,
              rgba(255,255,255,.46) 62%,
              rgba(255,255,255,0) 100%);
  -webkit-backdrop-filter:blur(22px) saturate(170%);
  backdrop-filter:blur(22px) saturate(170%);
  -webkit-mask-image:linear-gradient(180deg, #000 0%, #000 74%, rgba(0,0,0,0) 100%);
  mask-image:linear-gradient(180deg, #000 0%, #000 74%, rgba(0,0,0,0) 100%);
}

/* 状态栏（透明，直接落在玻璃上） */
.status{
  height:54px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px 0 38px;
  font-size:16.5px;
  font-weight:600;
  letter-spacing:.01em;
  color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.status__l{ display:flex; align-items:center; gap:7px; }
.status__r{ display:flex; align-items:center; gap:7px; }
.ico{ display:block; }
.ico--signal{ width:19px; height:12px; }
.ico--wifi{ width:19px; height:15px; }
.ico--mute{ width:17px; height:17px; }

/* 电量：半透明槽 + 白色进度 + 数字变色 */
.batt{ display:flex; align-items:center; gap:1.5px; }
.batt__body{
  position:relative;
  width:28px; height:13.8px;
  border-radius:4.2px;
  background:rgba(0,0,0,.16);
  overflow:hidden;
  display:flex; align-items:center; justify-content:center;
}
.batt__fill{
  position:absolute; left:0; top:0; bottom:0;
  width:0%;
  background:#ffffff;
  transition:width .35s ease;
}
.batt__num{
  position:relative; z-index:1;
  font-size:9.6px; font-weight:700; line-height:1;
  color:var(--ink);
  font-variant-numeric:tabular-nums;
  transition:color .25s ease;
}
.batt__num.is-low{ color:#b93a32; }
.batt__num.is-charging{ color:#2f7d48; }
.batt__nub{
  width:1.8px; height:5.6px;
  border-radius:.9px;
  background:rgba(0,0,0,.16);
}

/* 标题：只有两个字，没有底框 */
.title{
  margin:0;
  padding:6px 20px 0;
  font-size:26px;
  font-weight:600;
  letter-spacing:.01em;
  color:var(--ink);
  pointer-events:auto;
}

/* ---------- 列表 ---------- */
.view{
  position:relative;
  z-index:1;
  height:100%;
  overflow-y:auto;
  padding:132px 0 124px;
  scrollbar-width:none;
  overscroll-behavior:contain;
}
.view::-webkit-scrollbar{ display:none; }

.pane{ display:none; }
.pane.is-on{ display:block; }

.row{
  position:relative;
  width:100%;
  display:flex;
  align-items:center;
  gap:14px;
  padding:15px 18px;
  text-align:left;
  transition:background-color .15s ease;
}
.row:active{ background:rgba(0,0,0,.035); }
.row + .row::before{
  content:"";
  position:absolute;
  top:0; left:84px; right:18px;
  height:1px;
  background:var(--line);
}

.row__av{
  flex:0 0 auto;
  width:52px; height:52px;
  border-radius:50%;
  overflow:hidden;
  background:#ededf0;
  box-shadow:0 0 0 1px rgba(0,0,0,.05);
}
.row__av img{
  display:block;
  width:100%; height:100%;
  object-fit:cover;
  filter:brightness(.96) contrast(1.04) saturate(.88);
}

.row__body{
  flex:1 1 auto;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:3px;
}
.row__top{ display:flex; align-items:baseline; gap:6px; min-width:0; }
.row__name{
  font-size:16.5px;
  font-weight:700;
  letter-spacing:.01em;
  color:var(--ink);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.row__handle{
  flex:0 0 auto;
  font-size:11px;
  font-weight:400;
  color:var(--ink-3);
}
.row__prev{
  font-size:13px;
  line-height:17px;
  color:var(--ink-2);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.row__meta{
  flex:0 0 auto;
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:6px;
  padding-top:2px;
}
.row__time{
  font-size:11.5px;
  color:var(--ink-3);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.row__badge{
  min-width:19px; height:19px;
  padding:0 5px;
  border-radius:999px;
  background:rgba(17,17,17,.85);
  color:#fff;
  font-size:11px;
  font-weight:700;
  line-height:19px;
  text-align:center;
  font-variant-numeric:tabular-nums;
}

/* ---------- 空态 ---------- */
.empty{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
  padding:120px 24px 0;
  text-align:center;
}
.empty__mark{
  width:56px; height:56px;
  border-radius:50%;
  background:rgba(252,252,253,.85);
  border:1px solid rgba(0,0,0,.05);
  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);
  display:grid;
  place-items:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95);
}
.empty__mark svg{ width:24px; height:24px; }
.empty__title{
  margin:0;
  font-size:14px;
  font-weight:600;
  color:var(--ink);
}
.empty__desc{
  margin:0;
  font-size:12.5px;
  line-height:1.6;
  color:var(--ink-2);
}

/* ---------- 底部液态玻璃胶囊 ---------- */
.tabs{
  position:absolute;
  left:50%;
  bottom:calc(env(safe-area-inset-bottom, 0px) + 20px);
  transform:translateX(-50%);
  z-index:20;
  display:flex;
  align-items:center;
  gap:2px;
  padding:4px;
  border-radius:999px;
  background:linear-gradient(180deg,
              rgba(255,255,255,.58) 0%,
              rgba(255,255,255,.34) 100%);
  border:1px solid rgba(255,255,255,.9);
  -webkit-backdrop-filter:blur(26px) saturate(180%);
  backdrop-filter:blur(26px) saturate(180%);
  box-shadow:
    0 16px 36px -14px rgba(0,0,0,.26),
    0 0 0 1px rgba(0,0,0,.05),
    inset 0 1px 0 rgba(255,255,255,.95),
    inset 0 -1px 3px rgba(0,0,0,.05);
}
.tab{
  height:38px;
  padding:0 20px;
  border-radius:999px;
  font-size:13px;
  font-weight:500;
  letter-spacing:.02em;
  white-space:nowrap;
  color:#8a8a8f;
  transition:color .18s ease, background-color .18s ease, box-shadow .18s ease;
}
.tab:active{ color:var(--ink); }
.tab.is-on{
  background:linear-gradient(180deg, rgba(255,255,255,.96), rgba(255,255,255,.74));
  color:var(--ink);
  font-weight:600;
  box-shadow:
    0 1px 2px rgba(0,0,0,.10),
    0 0 0 1px rgba(0,0,0,.04),
    inset 0 1px 0 rgba(255,255,255,1);
}

/* ---------- 轻提示 ---------- */
.toast{
  position:absolute;
  left:50%;
  bottom:104px;
  transform:translate(-50%, 8px);
  z-index:30;
  max-width:76%;
  padding:8px 14px;
  border-radius:13px;
  background:rgba(17,17,17,.88);
  -webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);
  color:#fff;
  font-size:12.5px;
  line-height:1.4;
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
  transition:opacity .22s ease, transform .22s ease;
}
.toast.is-on{ opacity:1; transform:translate(-50%, 0); }

@media (prefers-reduced-motion:reduce){
  .toast{ transition:none; }
  .batt__fill{ transition:none; }
}
</style>
</head>

  <nav class="tabs" id="tabs" aria-label="主导航">
    <button class="tab is-on" data-pane="0" aria-current="page">消息</button>
    <button class="tab" data-pane="1">朋友圈</button>
    <button class="tab" data-pane="2">个人资料</button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
(function(){
  const clock   = document.getElementById('clock');
  const battFill= document.getElementById('battFill');
  const battNum = document.getElementById('battNum');
  const toastEl = document.getElementById('toast');
  const view    = document.getElementById('view');
  const tabs    = Array.from(document.querySelectorAll('.tab'));
  const panes   = Array.from(document.querySelectorAll('.pane'));

  const pad  = n => (n < 10 ? '0' + n : '' + n);
  const hhmm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());

  /* ---------- 状态栏时间：真实时间 ---------- */
  function tickClock(){ clock.textContent = hhmm(new Date()); }
  tickClock();
  setInterval(tickClock, 15000);

  /* ---------- 状态栏电量：设备真实电量 ---------- */
  function paintBattery(level, charging){
    const pct = Math.round(level * 100);
    battNum.textContent = pct;
    battFill.style.width = Math.max(4, pct) + '%';
    battNum.classList.toggle('is-low', !charging && pct <= 20);
    battNum.classList.toggle('is-charging', charging);
    document.getElementById('batt').title = '电量 ' + pct + '%' + (charging ? ' · 充电中' : '');
  }
  if (navigator.getBattery){
    navigator.getBattery().then(function(b){
      const sync = () => paintBattery(b.level, b.charging);
      sync();
      b.addEventListener('levelchange', sync);
      b.addEventListener('chargingchange', sync);
    }).catch(function(){ paintBattery(0.5, false); });
  } else {
    paintBattery(0.5, false);
  }

  /* ---------- 列表时间：按真实时钟从 data-at 倒推 ---------- */
  const now0 = new Date();
  document.querySelectorAll('.row[data-at]').forEach(function(row){
    const off = parseInt(row.dataset.at, 10) || 0;
    const d = new Date(now0.getTime() - off * 60000);
    const el = row.querySelector('.row__time');
    if (el) el.textContent = hhmm(d);
  });

  /* ---------- 轻提示 ---------- */
  let toastTimer = null;
  function toast(text){
    toastEl.textContent = text;
    toastEl.classList.add('is-on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('is-on'), 1800);
  }

  /* ---------- 底部胶囊切换 ---------- */
  tabs.forEach(function(tab){
    tab.addEventListener('click', function(){
      const idx = Number(tab.dataset.pane);
      tabs.forEach(function(t){
        const on = t === tab;
        t.classList.toggle('is-on', on);
        if(on) t.setAttribute('aria-current','page');
        else t.removeAttribute('aria-current');
      });
      panes.forEach(function(p){
        p.classList.toggle('is-on', Number(p.dataset.pane) === idx);
      });
      view.scrollTop = 0;
    });
  });

  /* ---------- 列表行反馈 ---------- */
  document.querySelectorAll('.row').forEach(function(row){
    row.addEventListener('click', function(){
      toast('打开与「' + row.dataset.name + '」的对话');
    });
  });
})();
</script>
